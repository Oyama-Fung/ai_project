[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OYAMA", email = "947544040@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cos-python-sdk-v5>=1.9.44",
    "docling>=2.120.2",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
backend = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv-build]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 4

[tool.ruff.lint]
select = [
  "E", "W",
  "I",
  "F",
  "B",
  "UP",
  "RUF",
  "SIM"
]
ignore = ["F401","RUF001","RUF002","RUF003","B008"]


[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

